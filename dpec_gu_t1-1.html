<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DPEC - Relevamiento GU T1</title>
<link rel="manifest" href="./t1-manifest.json">
<meta name="theme-color" content="#14181a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./gu-icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14181a;
    color: #e7e4dc;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow-x: hidden;
  }
  #app { min-height: 100%; display: flex; flex-direction: column; }

  /* ===== Header ===== */
  .hdr {
    background: linear-gradient(135deg, #1c2b1f 0%, #14181a 100%);
    border-bottom: 2px solid #3a6b3f;
    padding: 12px 14px;
    position: sticky; top: 0; z-index: 20;
  }
  .hdr-top { display: flex; align-items: center; justify-content: space-between; }
  .hdr-brand { display: flex; align-items: center; gap: 8px; }
  .hdr-logo {
    width: 30px; height: 30px; border-radius: 7px;
    background: linear-gradient(135deg, #d9a441, #b9822c);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: #14181a; flex: none;
  }
  .hdr-title { font-size: 14px; font-weight: 700; letter-spacing: .3px; color: #f2efe6; }
  .hdr-sub { font-size: 10.5px; color: #8fae86; margin-top: 1px; }
  .hdr-back {
    background: none; border: 1px solid #3a4a3d; color: #cfcabb;
    border-radius: 8px; padding: 7px 11px; font-size: 12.5px;
  }
  .hdr-back:active { background: #24302a; }

  .progress-wrap { margin-top: 10px; }
  .progress-bar-track { height: 6px; border-radius: 4px; background: #26302a; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #3a6b3f, #6fae62); border-radius: 4px; transition: width .25s; }
  .progress-txt { font-size: 11px; color: #9ea89a; margin-top: 5px; display: flex; justify-content: space-between; }

  /* ===== Body ===== */
  .main { flex: 1; padding: 12px 12px 90px 12px; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* Zona grid */
  .zona-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .zona-card {
    background: #1b2120; border: 1px solid #2b332e; border-radius: 12px;
    padding: 12px 12px 10px 12px; text-align: left;
  }
  .zona-card:active { border-color: #6fae62; }
  .zona-name { font-size: 13px; font-weight: 700; color: #f2efe6; line-height: 1.25; min-height: 33px; }
  .zona-meta { font-size: 10.5px; color: #8b968a; margin-top: 7px; }
  .zona-bar-track { height: 5px; border-radius: 3px; background: #262c28; margin-top: 6px; overflow: hidden; }
  .zona-bar-fill { height: 100%; background: #d9a441; border-radius: 3px; }
  .zona-bar-fill.done { background: #6fae62; }

  /* Search */
  .med-search-box {
    display: flex; align-items: center; gap: 12px; background: #1c2318;
    border: 2px solid #6fae62; border-radius: 15px; padding: 18px 18px; margin-bottom: 14px;
  }
  .med-search-box span { font-size: 24px; }
  .med-search-box input {
    flex: 1; background: none; border: none; color: #f2efe6; font-size: 22px; font-weight: 700; outline: none;
  }
  .med-search-box input::placeholder { color: #7c9f76; font-weight: 600; }

  .search-box {
    display: flex; align-items: center; gap: 10px; background: #1b2120;
    border: 1.5px solid #2b332e; border-radius: 13px; padding: 14px 16px; margin-bottom: 12px;
  }
  .search-box span { font-size: 19px; }
  .search-box input {
    flex: 1; background: none; border: none; color: #e7e4dc; font-size: 17px; outline: none;
  }
  .filter-row { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px; }
  .filter-chip {
    flex: none; font-size: 11.5px; padding: 6px 11px; border-radius: 20px;
    background: #1b2120; border: 1px solid #2b332e; color: #b9c0b6; white-space: nowrap;
  }
  .filter-chip.active { background: #2c4630; border-color: #6fae62; color: #d9edd0; }

  .u-item {
    background: #1b2120; border: 1px solid #2b332e; border-radius: 11px;
    padding: 11px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
  }
  .u-item:active { border-color: #d9a441; }
  .u-status-dot { width: 10px; height: 10px; border-radius: 50%; background: #4a5450; flex: none; }
  .u-status-dot.done { background: #6fae62; }
  .u-status-dot.pending { background: #d9a441; }
  .u-body { flex: 1; min-width: 0; }
  .u-name { font-size: 13.5px; font-weight: 700; color: #f2efe6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .u-meta { font-size: 11px; color: #8b968a; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .u-arrow { color: #55605a; font-size: 16px; }

  .empty-msg { text-align: center; color: #6c766f; font-size: 13px; padding: 30px 10px; }

  /* Detail form */
  .card { background: #1b2120; border: 1px solid #2b332e; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: #7c9f76; font-weight: 700; margin-bottom: 4px; }
  .card-value { font-size: 15px; color: #f2efe6; font-weight: 600; }
  .card-value.small { font-size: 12.5px; color: #c7c2b3; font-weight: 400; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; color: #9ea89a; margin-bottom: 6px; font-weight: 600; }
  .field input[type=text], .field input[type=number] {
    width: 100%; background: #12100e; border: 1.5px solid #33403a; border-radius: 9px;
    padding: 12px 12px; font-size: 16px; color: #f2efe6; outline: none;
  }
  .field input:focus { border-color: #6fae62; }

  .estado-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .estado-opt {
    padding: 11px 8px; border-radius: 9px; border: 1.5px solid #33403a; background: #12100e;
    color: #c7c2b3; font-size: 12.5px; text-align: center; font-weight: 600;
  }
  .estado-opt.sel { border-color: #6fae62; background: #1f3322; color: #d9edd0; }

  .gps-box {
    border: 1.5px dashed #3a4a3d; border-radius: 10px; padding: 14px; text-align: center;
    color: #8b968a; font-size: 12.5px;
  }
  .gps-ok {
    border: 1.5px solid #3a6b3f; border-radius: 10px; padding: 11px 12px; background: #16221a;
  }
  .gps-coords { font-size: 13.5px; font-weight: 700; color: #d9edd0; }
  .gps-acc { font-size: 11px; color: #8b968a; margin-top: 3px; }
  .gps-btns { display: flex; gap: 8px; margin-top: 9px; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 2px; margin-bottom: 4px;
  }
  .toggle-row label { font-size: 13px; color: #e7e4dc; font-weight: 600; margin: 0; }
  .switch { position: relative; width: 46px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; inset: 0; background: #33403a; border-radius: 20px; transition: background .15s;
  }
  .switch-track:before {
    content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px;
    background: #cfcabb; border-radius: 50%; transition: transform .15s;
  }
  .switch input:checked + .switch-track { background: #4a8a45; }
  .switch input:checked + .switch-track:before { transform: translateX(20px); background: #f2efe6; }
  .cambio-extra { margin-top: 12px; padding-top: 12px; border-top: 1px solid #262c28; }

  .photo-box {
    border: 1.5px dashed #3a4a3d; border-radius: 10px; padding: 14px; text-align: center;
    color: #8b968a; font-size: 12.5px; margin-top: 4px;
  }
  .photo-preview { width: 100%; border-radius: 9px; display: block; margin-bottom: 8px; }
  .photo-btns { display: flex; gap: 8px; }
  .btn-mini {
    flex: 1; background: #24302a; border: 1px solid #3a4a3d; color: #d9edd0;
    border-radius: 8px; padding: 9px; font-size: 12px; font-weight: 600;
  }

  /* Buttons */
  .btn { width: 100%; padding: 14px; border-radius: 11px; font-size: 15px; font-weight: 700; border: none; }
  .btn-primary { background: linear-gradient(135deg, #6fae62, #4a8a45); color: #0d140d; }
  .btn-primary:active { opacity: .85; }
  .btn-secondary { background: #1b2120; border: 1px solid #3a4a3d; color: #cfcabb; }
  .btn-danger { background: #2e1a18; border: 1px solid #5a2c27; color: #e8a49c; }
  .btn-row { display: flex; gap: 8px; margin-top: 6px; }
  .btn-row .btn { width: auto; flex: 1; }

  /* Bottom bar */
  .bottombar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #171c1a; border-top: 1px solid #2b332e;
    padding: 10px 12px; display: flex; gap: 8px; z-index: 20;
  }
  .bottombar .btn { padding: 12px; font-size: 13.5px; }

  .toast {
    position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
    background: #2c4630; color: #d9edd0; padding: 10px 18px; border-radius: 20px;
    font-size: 13px; font-weight: 600; z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40;
    align-items: flex-end; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal-sheet { background: #191f1c; border-radius: 16px 16px 0 0; padding: 18px 16px 22px 16px; width: 100%; max-width: 480px; }
  .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: #f2efe6; }
  .modal-row { padding: 12px 4px; border-bottom: 1px solid #262c28; font-size: 13.5px; color: #cfcabb; }
  .modal-row:last-child { border-bottom: none; }
</style>
</head>
<body>
<div id="app">

  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-brand">
        <div class="hdr-logo">GU</div>
        <div>
          <div class="hdr-title" id="hdrTitle">Relevamiento GU T1</div>
          <div class="hdr-sub" id="hdrSub">DPEC · Grandes Usuarios</div>
        </div>
      </div>
      <button class="hdr-back" id="btnBack" style="display:none;">&#8592; Volver</button>
    </div>
    <div class="progress-wrap" id="progressWrap" style="display:none;">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill" style="width:0%;"></div></div>
      <div class="progress-txt"><span id="progressTxt">0 / 0 cargados</span><span id="progressPct">0%</span></div>
    </div>
  </div>

  <div class="main">

    <!-- SCREEN: Home (zonas) -->
    <div class="screen active" id="screenHome">
      <div class="med-search-box">
        <span>&#128269;</span>
        <input type="text" id="medSearch" placeholder="N&deg; de medidor..." inputmode="numeric">
      </div>
      <div id="medSearchResults"></div>
      <div class="search-box" id="zonaSearchBox">
        <span>&#128269;</span>
        <input type="text" id="zonaSearch" placeholder="Buscar zona...">
      </div>
      <div class="zona-grid" id="zonaGrid"></div>
    </div>

    <!-- SCREEN: Zona (lista de usuarios) -->
    <div class="screen" id="screenZona">
      <div class="search-box">
        <span>&#128269;</span>
        <input type="text" id="userSearch" placeholder="Buscar usuario, medidor o domicilio...">
      </div>
      <div class="filter-row">
        <div class="filter-chip active" data-f="todos">Todos</div>
        <div class="filter-chip" data-f="pendiente">Pendientes</div>
        <div class="filter-chip" data-f="cargado">Cargados</div>
      </div>
      <div id="userList"></div>
    </div>

    <!-- SCREEN: Detalle / Carga -->
    <div class="screen" id="screenDetalle">
      <div class="card">
        <div class="card-label">Usuario</div>
        <div class="card-value" id="dUsuario">-</div>
        <div style="height:8px;"></div>
        <div class="card-label">IC</div>
        <div class="card-value small" id="dIC">-</div>
        <div style="height:8px;"></div>
        <div class="card-label">Domicilio</div>
        <div class="card-value small" id="dDomicilio">-</div>
        <div style="height:8px;"></div>
        <div class="card-label">Zona</div>
        <div class="card-value small" id="dZona">-</div>
      </div>

      <div class="card">
        <div class="field">
          <label>N&deg; de Medidor (T1)</label>
          <input type="text" id="fMedidor" placeholder="Ej: 9770670" inputmode="numeric">
        </div>
        <div class="field">
          <label>Lectura</label>
          <input type="text" id="fLectura" placeholder="Ej: 004521" inputmode="numeric">
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Estado</label>
          <div class="estado-grid" id="estadoGrid"></div>
        </div>
      </div>

      <div class="card">
        <div class="toggle-row">
          <label for="fCambio">&#128260; Hubo cambio de medidor</label>
          <span class="switch">
            <input type="checkbox" id="fCambio">
            <span class="switch-track"></span>
          </span>
        </div>
        <div class="cambio-extra" id="cambioExtra" style="display:none;">
          <div class="field">
            <label>N&deg; de medidor anterior</label>
            <input type="text" id="fMedidorAnterior" placeholder="Medidor que se retir&oacute;" inputmode="numeric">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>Foto del medidor anterior</label>
            <div id="photoAreaOld"></div>
            <input type="file" id="photoInputOld" accept="image/*" style="display:none;">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="field" style="margin-bottom:0;">
          <label>Foto del medidor</label>
          <div id="photoArea"></div>
          <input type="file" id="photoInput" accept="image/*" style="display:none;">
        </div>
      </div>

      <button class="btn btn-primary" id="btnGuardar">Guardar registro</button>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btnLimpiar">Borrar carga</button>
      </div>
    </div>

  </div>

  <div class="bottombar" id="bottombarHome">
    <button class="btn btn-secondary" id="btnResumen">Resumen</button>
    <button class="btn btn-secondary" id="btnPdfTodo">PDF</button>
    <button class="btn btn-primary" id="btnExportar">CSV</button>
  </div>

  <div class="bottombar" id="bottombarZona" style="display:none;">
    <button class="btn btn-primary" id="btnPdfZona">Generar PDF de esta zona</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-bg" id="resumenModal">
    <div class="modal-sheet">
      <div class="modal-title">Resumen general</div>
      <div id="resumenBody"></div>
      <button class="btn btn-secondary" id="btnCerrarResumen" style="margin-top:12px;">Cerrar</button>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  /* ============ IndexedDB ============ */
  var DB_NAME = "dpec_gu_t1_db";
  var DB_VERSION = 1;
  var STORE = "registros";
  var db = null;

  function openDB(cb) {
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function (e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        d.createObjectStore(STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = function (e) { db = e.target.result; cb(); };
    req.onerror = function (e) { alert("Error abriendo la base local: " + e.target.error); };
  }

  function dbGetAll(cb) {
    var tx = db.transaction(STORE, "readonly");
    var store = tx.objectStore(STORE);
    var req = store.getAll();
    req.onsuccess = function () { cb(req.result || []); };
  }

  function dbPut(record, cb) {
    var tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(record);
    tx.oncomplete = function () { if (cb) cb(); };
  }

  function dbDelete(id, cb) {
    var tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = function () { if (cb) cb(); };
  }

  /* ============ State ============ */
  var records = {};      // id -> record
  var zonas = [];         // list of zona names sorted
  var zonaUsers = {};     // zona -> array of {usuario, ic, domicilio, zona, id}
  var currentZona = null;
  var currentUser = null;
  var currentFilter = "todos";
  var currentEstado = "";
  var currentFotoData = null;
  var currentGps = null; // { lat, lon, acc }
  var gpsWatching = false;
  var currentCambio = false;
  var currentFotoOldData = null;
  var allUsersFlat = []; // flat list of every usuario, for global meter search

  var ESTADOS = ["Correcto", "Roto / Da\u00f1ado", "Inaccesible", "Retirado", "Sin acceso al domicilio", "Otro"];

  function makeId(u) {
    return u.zona + "||" + u.ic + "||" + u.idx;
  }

  function buildIndex() {
    var seen = {};
    for (var i = 0; i < GU_DATA.length; i++) {
      var r = GU_DATA[i];
      var usuario = r[0], ic = r[1], domicilio = r[2], zona = r[3], medEsperado = r[4], tipo = r[5];
      var key = zona + "|" + ic;
      seen[key] = (seen[key] || 0) + 1;
      var idx = seen[key];
      var obj = { usuario: usuario, ic: ic, domicilio: domicilio, zona: zona, medEsperado: medEsperado, tipo: tipo, idx: idx };
      obj.id = makeId(obj);
      if (!zonaUsers[zona]) { zonaUsers[zona] = []; zonas.push(zona); }
      zonaUsers[zona].push(obj);
    }
    zonas.sort();
    for (var z in zonaUsers) {
      zonaUsers[z].sort(function (a, b) { return a.usuario.localeCompare(b.usuario); });
      for (var k = 0; k < zonaUsers[z].length; k++) allUsersFlat.push(zonaUsers[z][k]);
    }
  }

  /* ============ Screens ============ */
  function showScreen(name) {
    var scr = document.querySelectorAll(".screen");
    for (var i = 0; i < scr.length; i++) scr[i].classList.remove("active");
    document.getElementById(name).classList.add("active");
    document.getElementById("bottombarHome").style.display = (name === "screenHome") ? "flex" : "none";
    document.getElementById("bottombarZona").style.display = (name === "screenZona") ? "flex" : "none";
    document.getElementById("btnBack").style.display = (name === "screenHome") ? "none" : "block";
    document.getElementById("progressWrap").style.display = (name === "screenZona") ? "block" : "none";
  }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  /* ============ Home / Zonas ============ */
  function zonaStats(zona) {
    var list = zonaUsers[zona] || [];
    var done = 0;
    for (var i = 0; i < list.length; i++) {
      if (records[list[i].id]) done++;
    }
    return { total: list.length, done: done };
  }

  function renderMedSearch(query) {
    var box = document.getElementById("medSearchResults");
    var zonaBox = document.getElementById("zonaSearchBox");
    var grid = document.getElementById("zonaGrid");
    var q = (query || "").trim();
    if (q.length < 2) {
      box.innerHTML = "";
      zonaBox.style.display = "";
      grid.style.display = "";
      return;
    }
    zonaBox.style.display = "none";
    grid.style.display = "none";
    var qUp = q.toUpperCase();
    var matches = [];
    for (var i = 0; i < allUsersFlat.length; i++) {
      var u = allUsersFlat[i];
      var rec = records[u.id];
      var medEsperado = u.medEsperado || "";
      var medCargado = rec ? (rec.medidor || "") : "";
      if (medEsperado.toUpperCase().indexOf(qUp) !== -1 || medCargado.toUpperCase().indexOf(qUp) !== -1) {
        matches.push(u);
      }
      if (matches.length >= 40) break;
    }
    if (matches.length === 0) {
      box.innerHTML = '<div class="empty-msg">Sin coincidencias de medidor.</div>';
      return;
    }
    var html = "";
    for (var j = 0; j < matches.length; j++) {
      var m = matches[j];
      var mrec = records[m.id];
      var isDone = !!mrec;
      var medShown = isDone ? mrec.medidor : m.medEsperado;
      html +=
        '<div class="u-item" data-medidx="' + j + '">' +
          '<div class="u-status-dot ' + (isDone ? "done" : "pending") + '"></div>' +
          '<div class="u-body">' +
            '<div class="u-name">Med. ' + esc(medShown || "-") + ' \u00b7 ' + esc(m.usuario) + '</div>' +
            '<div class="u-meta">' + esc(m.zona) + ' \u00b7 IC ' + esc(m.ic) + '</div>' +
          '</div>' +
          '<div class="u-arrow">&#8250;</div>' +
        '</div>';
    }
    box.innerHTML = html;
    var items = box.querySelectorAll(".u-item");
    for (var k = 0; k < items.length; k++) {
      (function (mm) {
        items[k].addEventListener("click", function () {
          openZona(mm.zona);
          openDetalle(mm);
        });
      })(matches[k]);
    }
  }

  function renderZonaGrid(filterText) {    var grid = document.getElementById("zonaGrid");
    grid.innerHTML = "";
    var ft = (filterText || "").toUpperCase();
    for (var i = 0; i < zonas.length; i++) {
      var z = zonas[i];
      if (ft && z.toUpperCase().indexOf(ft) === -1) continue;
      var st = zonaStats(z);
      var pct = st.total ? Math.round((st.done / st.total) * 100) : 0;
      var card = document.createElement("div");
      card.className = "zona-card";
      card.innerHTML =
        '<div class="zona-name">' + esc(z) + '</div>' +
        '<div class="zona-meta">' + st.done + ' / ' + st.total + ' cargados</div>' +
        '<div class="zona-bar-track"><div class="zona-bar-fill' + (pct === 100 ? ' done' : '') + '" style="width:' + pct + '%;"></div></div>';
      (function (zz) {
        card.addEventListener("click", function () { openZona(zz); });
      })(z);
      grid.appendChild(card);
    }
  }

  function updateHomeProgressHeader() {
    document.getElementById("hdrTitle").textContent = "Relevamiento GU T1";
    document.getElementById("hdrSub").textContent = "DPEC \u00b7 Grandes Usuarios \u00b7 " + zonas.length + " zonas";
  }

  /* ============ Zona / Usuarios ============ */
  function openZona(zona) {
    currentZona = zona;
    currentFilter = "todos";
    document.getElementById("userSearch").value = "";
    var chips = document.querySelectorAll(".filter-chip");
    for (var i = 0; i < chips.length; i++) chips[i].classList.remove("active");
    document.querySelector('.filter-chip[data-f="todos"]').classList.add("active");
    document.getElementById("hdrTitle").textContent = zona;
    document.getElementById("hdrSub").textContent = "DPEC \u00b7 Grandes Usuarios";
    renderProgress();
    renderUserList();
    showScreen("screenZona");
  }

  function renderProgress() {
    var st = zonaStats(currentZona);
    var pct = st.total ? Math.round((st.done / st.total) * 100) : 0;
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressTxt").textContent = st.done + " / " + st.total + " cargados";
    document.getElementById("progressPct").textContent = pct + "%";
  }

  function renderUserList() {
    var listEl = document.getElementById("userList");
    listEl.innerHTML = "";
    var q = (document.getElementById("userSearch").value || "").toUpperCase();
    var list = zonaUsers[currentZona] || [];
    var shown = 0;
    for (var i = 0; i < list.length; i++) {
      var u = list[i];
      var rec = records[u.id];
      var isDone = !!rec;
      if (currentFilter === "pendiente" && isDone) continue;
      if (currentFilter === "cargado" && !isDone) continue;
      if (q) {
        var medMatch = (u.medEsperado || "") + " " + (rec ? (rec.medidor || "") : "");
        var hay = (u.usuario + " " + u.domicilio + " " + medMatch).toUpperCase();
        if (hay.indexOf(q) === -1) continue;
      }
      shown++;
      var item = document.createElement("div");
      item.className = "u-item";
      var metaExtra = isDone ? (" \u00b7 Med. " + (rec.medidor || "-") + " \u00b7 Lect. " + (rec.lectura || "-") + " \u00b7 " + (rec.estado || "-") + (rec.cambioMedidor ? " \u00b7 \ud83d\udd04 cambio" : "")) : (u.medEsperado ? (" \u00b7 Med. " + u.medEsperado) : "");
      item.innerHTML =
        '<div class="u-status-dot ' + (isDone ? "done" : "pending") + '"></div>' +
        '<div class="u-body">' +
          '<div class="u-name">' + esc(u.usuario) + '</div>' +
          '<div class="u-meta">IC ' + esc(u.ic) + ' \u00b7 ' + esc(u.domicilio) + esc(metaExtra) + '</div>' +
        '</div>' +
        '<div class="u-arrow">&#8250;</div>';
      (function (uu) {
        item.addEventListener("click", function () { openDetalle(uu); });
      })(u);
      listEl.appendChild(item);
    }
    if (shown === 0) {
      listEl.innerHTML = '<div class="empty-msg">No hay usuarios que coincidan.</div>';
    }
  }

  /* ============ Detalle ============ */
  function openDetalle(u) {
    currentUser = u;
    var rec = records[u.id];
    document.getElementById("dUsuario").textContent = u.usuario;
    document.getElementById("dIC").textContent = u.ic;
    document.getElementById("dDomicilio").textContent = u.domicilio;
    document.getElementById("dZona").textContent = u.zona + (u.tipo ? " \u00b7 " + u.tipo : "");
    document.getElementById("fMedidor").value = rec ? (rec.medidor || "") : (u.medEsperado || "");
    document.getElementById("fLectura").value = rec ? (rec.lectura || "") : "";
    currentEstado = rec ? (rec.estado || "") : "";
    currentFotoData = rec ? (rec.foto || null) : null;
    currentGps = (rec && rec.lat != null) ? { lat: rec.lat, lon: rec.lon, acc: rec.gpsAcc } : null;
    currentCambio = rec ? !!rec.cambioMedidor : false;
    currentFotoOldData = rec ? (rec.fotoAnterior || null) : null;
    document.getElementById("fMedidorAnterior").value = rec ? (rec.medidorAnterior || "") : "";
    document.getElementById("fCambio").checked = currentCambio;
    renderCambioExtra();
    renderPhotoAreaOld();
    renderEstadoGrid();
    renderPhotoArea();
    captureGpsSilently();
    showScreen("screenDetalle");
  }

  function renderEstadoGrid() {
    var grid = document.getElementById("estadoGrid");
    grid.innerHTML = "";
    for (var i = 0; i < ESTADOS.length; i++) {
      var e = ESTADOS[i];
      var opt = document.createElement("div");
      opt.className = "estado-opt" + (currentEstado === e ? " sel" : "");
      opt.textContent = e;
      (function (ee) {
        opt.addEventListener("click", function () {
          currentEstado = ee;
          renderEstadoGrid();
        });
      })(e);
      grid.appendChild(opt);
    }
  }

  function renderPhotoArea() {
    var area = document.getElementById("photoArea");
    if (currentFotoData) {
      area.innerHTML =
        '<img class="photo-preview" src="' + currentFotoData + '">' +
        '<div class="photo-btns">' +
          '<button class="btn-mini" id="btnRetomar">Retomar foto</button>' +
          '<button class="btn-mini" id="btnQuitarFoto">Quitar foto</button>' +
        '</div>';
      document.getElementById("btnRetomar").addEventListener("click", triggerPhoto);
      document.getElementById("btnQuitarFoto").addEventListener("click", function () {
        currentFotoData = null;
        renderPhotoArea();
      });
    } else {
      area.innerHTML = '<div class="photo-box" id="photoBoxTap">&#128247; Tocar para sacar foto del medidor</div>';
      document.getElementById("photoBoxTap").addEventListener("click", triggerPhoto);
    }
  }

  function renderCambioExtra() {
    document.getElementById("cambioExtra").style.display = currentCambio ? "block" : "none";
  }

  function renderPhotoAreaOld() {
    var area = document.getElementById("photoAreaOld");
    if (currentFotoOldData) {
      area.innerHTML =
        '<img class="photo-preview" src="' + currentFotoOldData + '">' +
        '<div class="photo-btns">' +
          '<button class="btn-mini" id="btnRetomarOld">Retomar foto</button>' +
          '<button class="btn-mini" id="btnQuitarFotoOld">Quitar foto</button>' +
        '</div>';
      document.getElementById("btnRetomarOld").addEventListener("click", function () {
        document.getElementById("photoInputOld").click();
      });
      document.getElementById("btnQuitarFotoOld").addEventListener("click", function () {
        currentFotoOldData = null;
        renderPhotoAreaOld();
      });
    } else {
      area.innerHTML = '<div class="photo-box" id="photoBoxTapOld">&#128247; Tocar para sacar foto del medidor anterior</div>';
      document.getElementById("photoBoxTapOld").addEventListener("click", function () {
        document.getElementById("photoInputOld").click();
      });
    }
  }

  function triggerPhoto() {
    document.getElementById("photoInput").click();
  }

  function captureGpsSilently() {
    if (!navigator.geolocation || gpsWatching) return;
    gpsWatching = true;
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        gpsWatching = false;
        currentGps = {
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          acc: pos.coords.accuracy
        };
      },
      function (err) {
        gpsWatching = false;
        /* silencioso: si falla, se guarda el registro sin punto GPS */
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  }

  function handlePhotoFile(file, onDone) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var maxW = 1000;
        var scale = Math.min(1, maxW / img.width);
        var w = Math.round(img.width * scale);
        var h = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        onDone(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function guardarRegistro() {
    if (!currentUser) return;
    var medidor = document.getElementById("fMedidor").value.replace(/\s+/g, "");
    var lectura = document.getElementById("fLectura").value.replace(/\s+/g, "");
    if (!medidor) {
      alert("Falta el n\u00famero de medidor.");
      return;
    }
    if (!lectura) {
      alert("Falta la lectura.");
      return;
    }
    if (!currentEstado) {
      alert("Eleg\u00ed el estado del medidor.");
      return;
    }
    var rec = {
      id: currentUser.id,
      zona: currentUser.zona,
      ic: currentUser.ic,
      usuario: currentUser.usuario,
      domicilio: currentUser.domicilio,
      tipo: currentUser.tipo || "",
      medidor: medidor,
      lectura: lectura,
      estado: currentEstado,
      cambioMedidor: currentCambio,
      medidorAnterior: currentCambio ? document.getElementById("fMedidorAnterior").value.replace(/\s+/g, "") : "",
      fotoAnterior: currentCambio ? (currentFotoOldData || "") : "",
      lat: currentGps ? currentGps.lat : null,
      lon: currentGps ? currentGps.lon : null,
      gpsAcc: currentGps ? currentGps.acc : null,
      foto: currentFotoData || "",
      fecha: new Date().toISOString()
    };
    records[rec.id] = rec;
    dbPut(rec, function () {
      toast("Registro guardado");
      renderProgress();
      renderUserList();
      renderZonaGrid(document.getElementById("zonaSearch").value);
      showScreen("screenZona");
    });
  }

  function borrarRegistro() {
    if (!currentUser) return;
    if (!records[currentUser.id]) { showScreen("screenZona"); return; }
    if (!confirm("\u00bfBorrar el registro cargado para este usuario?")) return;
    delete records[currentUser.id];
    dbDelete(currentUser.id, function () {
      toast("Registro borrado");
      renderProgress();
      renderUserList();
      renderZonaGrid(document.getElementById("zonaSearch").value);
      showScreen("screenZona");
    });
  }

  /* ============ Export CSV ============ */
  function csvEscape(v) {
    v = (v === undefined || v === null) ? "" : String(v);
    if (v.indexOf(";") !== -1 || v.indexOf('"') !== -1 || v.indexOf("\n") !== -1) {
      v = '"' + v.replace(/"/g, '""') + '"';
    }
    return v;
  }

  function exportCSV() {
    var keys = Object.keys(records);
    if (keys.length === 0) {
      alert("Todav\u00eda no hay registros cargados.");
      return;
    }
    var header = ["Zona", "IC", "Usuario", "Domicilio", "Tarifa", "Medidor", "Lectura", "Estado", "CambioMedidor", "MedidorAnterior", "Latitud", "Longitud", "PrecisionGPS_m", "Fecha", "TieneFoto", "TieneFotoAnterior"];
    var lines = [header.join(";")];
    keys.sort(function (a, b) {
      var ra = records[a], rb = records[b];
      if (ra.zona !== rb.zona) return ra.zona.localeCompare(rb.zona);
      return ra.usuario.localeCompare(rb.usuario);
    });
    for (var i = 0; i < keys.length; i++) {
      var r = records[keys[i]];
      var fecha = r.fecha ? new Date(r.fecha).toLocaleString("es-AR") : "";
      var lat = (r.lat != null) ? r.lat.toFixed(6) : "";
      var lon = (r.lon != null) ? r.lon.toFixed(6) : "";
      var acc = (r.gpsAcc != null) ? Math.round(r.gpsAcc) : "";
      var row = [r.zona, r.ic, r.usuario, r.domicilio, r.tipo || "", r.medidor, r.lectura, r.estado, (r.cambioMedidor ? "SI" : "NO"), (r.medidorAnterior || ""), lat, lon, acc, fecha, (r.foto ? "SI" : "NO"), (r.fotoAnterior ? "SI" : "NO")];
      lines.push(row.map(csvEscape).join(";"));
    }
    var csv = "\uFEFF" + lines.join("\r\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var d = new Date();
    var stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes());
    a.href = url;
    a.download = "dpec_gu_t1_" + stamp + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    toast("CSV exportado (" + keys.length + " registros)");

    exportFotos();
  }

  function exportFotos() {
    var keys = Object.keys(records);
    var lista = [];
    for (var i = 0; i < keys.length; i++) {
      var r = records[keys[i]];
      if (r.foto) lista.push({ rec: r, data: r.foto, tag: "" });
      if (r.fotoAnterior) lista.push({ rec: r, data: r.fotoAnterior, tag: "_anterior" });
    }
    if (lista.length === 0) return;
    var idx = 0;
    function next() {
      if (idx >= lista.length) return;
      var item = lista[idx];
      var r = item.rec;
      var a = document.createElement("a");
      a.href = item.data;
      var safeIc = String(r.ic).replace(/[^a-zA-Z0-9]/g, "");
      var safeZona = String(r.zona).replace(/[^a-zA-Z0-9]/g, "_");
      a.download = "foto_" + safeZona + "_" + safeIc + item.tag + ".jpg";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      idx++;
      setTimeout(next, 350);
    }
    if (confirm("Tambi\u00e9n hay " + lista.length + " foto(s) cargadas. \u00bfDescargarlas ahora?")) {
      next();
    }
  }

  /* ============ Export PDF ============ */
  function pdfEnsureSpace(doc, yRef, needed, margin, pageH) {
    if (yRef.y + needed > pageH - margin) {
      doc.addPage();
      yRef.y = margin;
    }
  }

  function buildPdfDoc(zonaScope) {
    var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 14;
    var yRef = { y: margin };

    doc.setFont("helvetica", "bold");
    doc.setFontSize(15);
    doc.text("DPEC - Relevamiento GU T1", margin, yRef.y);
    yRef.y += 7;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    var now = new Date();
    doc.text((zonaScope ? ("Zona: " + zonaScope) : "Todas las zonas") + "  -  " + now.toLocaleString("es-AR"), margin, yRef.y);
    yRef.y += 9;

    var scope = zonaScope ? [zonaScope] : zonas;

    for (var zi = 0; zi < scope.length; zi++) {
      var z = scope[zi];
      var list = (zonaUsers[z] || []).slice();
      var done = 0;
      for (var k = 0; k < list.length; k++) if (records[list[k].id]) done++;

      pdfEnsureSpace(doc, yRef, 12, margin, pageH);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(12);
      doc.text(z + "  (" + done + " / " + list.length + " cargados)", margin, yRef.y);
      yRef.y += 7;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9.5);

      var pendientes = [];
      var cargados = [];
      for (var i = 0; i < list.length; i++) {
        if (records[list[i].id]) cargados.push(list[i]); else pendientes.push(list[i]);
      }

      if (pendientes.length > 0) {
        pdfEnsureSpace(doc, yRef, 6, margin, pageH);
        doc.setFont("helvetica", "bold");
        doc.text("Pendientes (" + pendientes.length + "):", margin, yRef.y);
        yRef.y += 5.5;
        doc.setFont("helvetica", "normal");
        for (var p = 0; p < pendientes.length; p++) {
          var pu = pendientes[p];
          var line = "- " + pu.usuario + "  (IC " + pu.ic + ")  " + pu.domicilio;
          var wrapped = doc.splitTextToSize(line, pageW - margin * 2);
          pdfEnsureSpace(doc, yRef, wrapped.length * 4.6, margin, pageH);
          doc.text(wrapped, margin, yRef.y);
          yRef.y += wrapped.length * 4.6;
        }
        yRef.y += 3;
      }

      for (var c = 0; c < cargados.length; c++) {
        var u = cargados[c];
        var rec = records[u.id];
        pdfEnsureSpace(doc, yRef, 16, margin, pageH);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10.5);
        doc.text(u.usuario, margin, yRef.y);
        yRef.y += 5;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        var infoLines = [
          "IC " + u.ic + "   -   " + u.domicilio,
          "Tarifa: " + (u.tipo || "-") + "   -   Medidor: " + (rec.medidor || "-") + "   -   Lectura: " + (rec.lectura || "-"),
          "Estado: " + (rec.estado || "-") + (rec.cambioMedidor ? ("   -   Cambio de medidor (anterior: " + (rec.medidorAnterior || "-") + ")") : "")
        ];
        if (rec.lat != null) {
          infoLines.push("GPS: " + rec.lat.toFixed(6) + ", " + rec.lon.toFixed(6));
        }
        infoLines.push("Fecha: " + (rec.fecha ? new Date(rec.fecha).toLocaleString("es-AR") : "-"));
        for (var il = 0; il < infoLines.length; il++) {
          pdfEnsureSpace(doc, yRef, 4.6, margin, pageH);
          doc.text(infoLines[il], margin, yRef.y);
          yRef.y += 4.6;
        }
        yRef.y += 1;

        var imgW = 62;
        if (rec.foto) {
          try {
            var props = doc.getImageProperties(rec.foto);
            var imgH = imgW * props.height / props.width;
            pdfEnsureSpace(doc, yRef, imgH + 4, margin, pageH);
            doc.addImage(rec.foto, "JPEG", margin, yRef.y, imgW, imgH);
            if (rec.fotoAnterior) {
              try {
                var props2 = doc.getImageProperties(rec.fotoAnterior);
                var imgH2 = imgW * props2.height / props2.width;
                doc.setFontSize(8);
                doc.text("Medidor anterior", margin + imgW + 6, yRef.y + 3);
                doc.addImage(rec.fotoAnterior, "JPEG", margin + imgW + 6, yRef.y + 5, imgW, imgH2);
                yRef.y += Math.max(imgH, imgH2 + 5) + 5;
              } catch (e2) {
                yRef.y += imgH + 5;
              }
            } else {
              yRef.y += imgH + 5;
            }
          } catch (e) {
            yRef.y += 2;
          }
        } else if (rec.fotoAnterior) {
          try {
            var props3 = doc.getImageProperties(rec.fotoAnterior);
            var imgH3 = imgW * props3.height / props3.width;
            pdfEnsureSpace(doc, yRef, imgH3 + 4, margin, pageH);
            doc.setFontSize(8);
            doc.text("Medidor anterior", margin, yRef.y + 3);
            doc.addImage(rec.fotoAnterior, "JPEG", margin, yRef.y + 5, imgW, imgH3);
            yRef.y += imgH3 + 9;
          } catch (e3) {
            yRef.y += 2;
          }
        }

        pdfEnsureSpace(doc, yRef, 4, margin, pageH);
        doc.setDrawColor(200, 200, 200);
        doc.line(margin, yRef.y, pageW - margin, yRef.y);
        yRef.y += 6;
      }

      yRef.y += 3;
    }

    return doc;
  }

  function generarPDF(zonaScope) {
    if (typeof window.jspdf === "undefined") {
      alert("Falta el archivo jspdf.umd.min.js en el repo. Sub\u00ed ese archivo junto al resto para poder generar el PDF.");
      return;
    }
    var keys = Object.keys(records);
    if (keys.length === 0 && !confirm("Todav\u00eda no hay registros cargados. \u00bfGenerar igual el PDF con la lista de pendientes?")) {
      return;
    }
    var doc = buildPdfDoc(zonaScope);
    var d = new Date();
    var stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes());
    var safeZona = zonaScope ? zonaScope.replace(/[^a-zA-Z0-9]/g, "_") : "todas";
    doc.save("dpec_gu_t1_" + safeZona + "_" + stamp + ".pdf");
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function esc(s) {
    s = (s === undefined || s === null) ? "" : String(s);
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* ============ Resumen ============ */
  function renderResumen() {
    var body = document.getElementById("resumenBody");
    var totalUsers = GU_DATA.length;
    var totalDone = Object.keys(records).length;
    var html = '<div class="modal-row"><b>Total general:</b> ' + totalDone + ' / ' + totalUsers + ' cargados</div>';
    var sorted = zonas.slice().sort();
    for (var i = 0; i < sorted.length; i++) {
      var z = sorted[i];
      var st = zonaStats(z);
      html += '<div class="modal-row">' + esc(z) + ': ' + st.done + ' / ' + st.total + '</div>';
    }
    body.innerHTML = html;
  }

  /* ============ Init / Events ============ */
  function init() {
    buildIndex();
    updateHomeProgressHeader();
    openDB(function () {
      dbGetAll(function (list) {
        for (var i = 0; i < list.length; i++) records[list[i].id] = list[i];
        renderZonaGrid("");
      });
    });

    document.getElementById("zonaSearch").addEventListener("input", function () {
      renderZonaGrid(this.value);
    });

    document.getElementById("medSearch").addEventListener("input", function () {
      renderMedSearch(this.value);
    });

    document.getElementById("userSearch").addEventListener("input", renderUserList);

    var chips = document.querySelectorAll(".filter-chip");
    for (var i = 0; i < chips.length; i++) {
      chips[i].addEventListener("click", function () {
        for (var j = 0; j < chips.length; j++) chips[j].classList.remove("active");
        this.classList.add("active");
        currentFilter = this.getAttribute("data-f");
        renderUserList();
      });
    }

    document.getElementById("btnBack").addEventListener("click", function () {
      var zonaScreen = document.getElementById("screenZona").classList.contains("active");
      var detScreen = document.getElementById("screenDetalle").classList.contains("active");
      if (detScreen) {
        showScreen("screenZona");
        renderProgress();
        renderUserList();
      } else if (zonaScreen) {
        document.getElementById("hdrTitle").textContent = "Relevamiento GU T1";
        document.getElementById("hdrSub").textContent = "DPEC \u00b7 Grandes Usuarios \u00b7 " + zonas.length + " zonas";
        renderZonaGrid(document.getElementById("zonaSearch").value);
        showScreen("screenHome");
      }
    });

    document.getElementById("photoInput").addEventListener("change", function (e) {
      if (e.target.files && e.target.files[0]) {
        handlePhotoFile(e.target.files[0], function (dataUrl) {
          currentFotoData = dataUrl;
          renderPhotoArea();
        });
      }
      this.value = "";
    });

    document.getElementById("photoInputOld").addEventListener("change", function (e) {
      if (e.target.files && e.target.files[0]) {
        handlePhotoFile(e.target.files[0], function (dataUrl) {
          currentFotoOldData = dataUrl;
          renderPhotoAreaOld();
        });
      }
      this.value = "";
    });

    document.getElementById("fCambio").addEventListener("change", function () {
      currentCambio = this.checked;
      renderCambioExtra();
      if (currentCambio) renderPhotoAreaOld();
    });

    document.getElementById("btnGuardar").addEventListener("click", guardarRegistro);
    document.getElementById("btnLimpiar").addEventListener("click", borrarRegistro);
    document.getElementById("btnExportar").addEventListener("click", exportCSV);
    document.getElementById("btnPdfTodo").addEventListener("click", function () { generarPDF(null); });
    document.getElementById("btnPdfZona").addEventListener("click", function () { generarPDF(currentZona); });
    document.getElementById("btnResumen").addEventListener("click", function () {
      renderResumen();
      document.getElementById("resumenModal").classList.add("show");
    });
    document.getElementById("btnCerrarResumen").addEventListener("click", function () {
      document.getElementById("resumenModal").classList.remove("show");
    });
  }

  document.addEventListener("DOMContentLoaded", init);
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./t1-sw.js").catch(function () {});
  });
}
